name: Video source validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: python -m pip install -r requirements-dev.txt
      - run: python colab/build_telugu.py --check
      - run: python -m unittest discover -s cinematic/tests -v
      - run: python -m unittest discover -s colab/tests -v
